# Lifesteal Config

# For hearts lost on death and hearts gained on kill:
# Putting "ALL" as the value makes a player lose all hearts on death
# or gain all of a player's hearts on kill.
#
# Example:
# If a player with 15 hearts kills someone with 7 hearts:
# - Killer goes to max hearts (20)
# - Extra hearts (2) drop on the ground

starting-hearts: 10
revive-hearts: 3

hearts-gain-on-kill: 1
hearts-lost-on-death: 1

max-hearts: 20

# If a player's hearts go BELOW this amount,
# they are banned.
#
# Example:
# min-hearts: 1
# Player reaches 0 hearts -> banned
min-hearts: 1

# If false:
# Players only drop hearts when killed by another player
#
# If true:
# Natural deaths also drop hearts
drop-hearts-with-natural-cause: false

messages:
  heart-gained: "You gained %amount% heart(s)."
  heart-withdrew: "Withdrew %amount% heart(s)."

  player-ban-message: "§c%player% was banned"
  player-ban-reason: "§cYou were banned"

# Global sound played when a player is banned
player-ban-sound: "ENTITY_WITHER_SPAWN"

# =========================================================
# Items
# =========================================================

items:

  # =======================================================
  # Heart Item
  # =======================================================
  heart:

    item-name: "§4Heart"

    # Bukkit/Paper Sound Enum
    sound-played-on-use: "BLOCK_RESPAWN_ANCHOR_CHARGE"

    # Bukkit Material Enum
    base-item: "NETHER_STAR"

    enchant-glint: true

    recipe:
      shape:
        - "N N"
        - "NOI"
        - "N N"

      ingredients:
        N: "NAUTILUS_SHELL"
        O: "OMINOUS_TRIAL_KEY"
        I: "NETHERITE_INGOT"

  # =======================================================
  # Revive Beacon
  # =======================================================
  revive-beacon:

    item-name: "§2Revive Beacon"

    # Bukkit/Paper Sound Enum
    sound-played-on-use: "BLOCK_BEACON_POWER_SELECT"

    enchant-glint: true

    recipe:
      shape:
        - "HCH"
        - "EHG"
        - "IGI"

      ingredients:
        H: "NETHER_STAR"
        C: "HEAVY_CORE"
        E: "ELYTRA"
        G: "ENCHANTED_GOLDEN_APPLE"
        I: "NETHERITE_INGOT"
